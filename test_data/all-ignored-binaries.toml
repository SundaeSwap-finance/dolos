# The test targets whose ok asserts nothing, and what each one needs before it
# can assert something. scripts/musashi/ignored-inventory.py reads this against
# a cargo test log and refuses a target the list does not hold, so a workspace
# green that grows another silent target stops being green.
#
# A target belongs in all_ignored when it holds tests and ignores every one of
# them, and in empty when it holds no test. A target that starts passing a test
# is reported as stale here and its entry is removed rather than kept.

[[all_ignored]]
target = "smoke tests/e2e/smoke.rs"
reason = "six scenarios that each start the daemon and sync from a relay, so they need a network and a node this run has neither of"

[[all_ignored]]
target = "snapshot tests/e2e/snapshot.rs"
reason = "one tarball and stele roundtrip over a node synced from the relay for a minute, same network need as the smoke scenarios"

[[all_ignored]]
target = "restore_registry tests/restore_registry.rs"
reason = "seven restores that each spawn an OCI registry, ignored upstream so a run with no registry does not hang"

[[all_ignored]]
target = "snapshot_verify tests/snapshot_verify.rs"
reason = "six verifications marked spawns a registry upstream, same need as the restores"

[[all_ignored]]
target = "doctest dolos_cardano"
reason = "three fenced examples written as ignore because they name types the doc does not bring into scope"

[[all_ignored]]
target = "doctest dolos_core"
reason = "one fenced example written as ignore, the cbor layout sketch in cbor.rs"

[[all_ignored]]
target = "doctest dolos_fjall"
reason = "one fenced example written as ignore, the key layout sketch in keys.rs"

[[all_ignored]]
target = "doctest dolos_redb3"
reason = "one fenced example written as ignore, the write ahead log sketch in wal/mod.rs"

[[empty]]
target = "cargo_xtask unittests src/main.rs"
reason = "the xtask binary crate holds no unit test, its logic is exercised through the xtask test targets"

