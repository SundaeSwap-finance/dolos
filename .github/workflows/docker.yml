name: Docker
on:
  push:
    branches:
      - "leios-musashi"
    tags:
      - "leios-musashi-*"

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest

  judge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: judge

      # libtest exits zero when its filter matches no test, so each step
      # also requires its count line to show a passed test.
      - name: Judge Dolos against the ledger corpora
        shell: bash
        run: |
          cargo test --release -p dolos --lib -- serve::grpc::v1::ledger_oracle_tests::ledger_oracle --exact --ignored --test-threads=1 | tee judge.log
          grep -q '^test result: ok. 1 passed' judge.log

      - name: Run the judge self tests
        shell: bash
        run: |
          cargo test --release -p dolos --lib -- serve::grpc::v1::ledger_oracle_tests:: --ignored --test-threads=1 --skip serve::grpc::v1::ledger_oracle_tests::ledger_oracle --skip serve::grpc::v1::ledger_oracle_tests::n2n:: --skip serve::grpc::v1::ledger_oracle_tests::endorser:: | tee self.log
          grep -Eq '^test result: ok. [1-9][0-9]* passed' self.log

  pallas-ci:
    name: Require pallas CI at the pinned commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A pull request run tests a merge commit, so only a push run tests the pinned commit.
      - name: Find a successful pallas CI push run for each pallas commit in Cargo.lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pins=$(python3 - <<'EOF'
          import re, sys, tomllib
          with open("Cargo.lock", "rb") as f:
              packages = tomllib.load(f)["package"]
          pins = set()
          for p in packages:
              if p["name"] != "pallas" and not p["name"].startswith("pallas-"):
                  continue
              m = re.fullmatch(r"git\+https://github\.com/([\w.-]+/[\w.-]+?)(?:\.git)?(?:\?[^#]*)?#([0-9a-f]{40})", p.get("source", ""))
              if m is None:
                  sys.exit(f"{p['name']} {p['version']} is not pinned to a GitHub commit: {p.get('source', 'a path dependency')}")
              pins.add(m.groups())
          if not pins:
              sys.exit("Cargo.lock has no pallas package")
          for repo, sha in sorted(pins):
              print(repo, sha)
          EOF
          )
          failed=0
          while read -r repo sha; do
            select="[.workflow_runs[] | select(.head_sha == \"$sha\" and .path == \".github/workflows/ci.yml\" and .event == \"push\" and .conclusion == \"success\")][0].html_url // \"\""
            if ! url=$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq "$select"); then
              echo "::error::pallas $repo@$sha: its CI runs could not be read"
              failed=1
            elif [ -z "$url" ]; then
              echo "::error::pallas $repo@$sha has no successful CI push run"
              failed=1
            else
              echo "pallas $repo@$sha passed CI in $url"
            fi
          done <<< "$pins"
          exit "$failed"

  build:
    needs: [test, judge, pallas-ci]
    continue-on-error: true

    strategy:
      matrix:
        include:
          - release_for: Linux-x86_64
            build_on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--locked --release"

          - release_for: Linux-arm64
            build_on: ubuntu-22.04-arm
            target: "aarch64-unknown-linux-gnu"
            args: "--locked --release"

    runs-on: ${{ matrix.build_on }}
    env:
        GIT_REVISION: "${{ github.sha }}"

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Run cargo build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --target ${{ matrix.target }} ${{ matrix.args }}

      - name: rename binaries
        run: |
          mv target/${{ matrix.target }}/release/dolos${{ matrix.ext }} dolos-${{ matrix.release_for }}${{ matrix.ext }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.release_for }}
          path: dolos-${{ matrix.release_for }}${{ matrix.ext }}

  docker:
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sundaeswap-finance/dolos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/leios-musashi' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/leios-musashi-') }}
            type=sha

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .github/image/bin

      # we need to rename the artifact so that the name matches
      # the value that Docker uses for TARGET_ARCH to keep the
      # Dockerfile simple
      - name: Rename artifacts
        run: |+
          mv .github/image/bin/dolos-Linux-x86_64 .github/image/bin/dolos-Linux-amd64

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .github/image
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
