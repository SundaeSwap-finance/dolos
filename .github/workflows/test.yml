name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-cache hashes the CARGO variables into its key, so the CI jobs that
  # restore this job's cache set the same values.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          # `all-features` and `e2e` restore this read only, and without a shared
          # key each would save its own multi GB entry against a full quota.
          shared-key: test-ubuntu-latest

      - name: Run the small and medium tests
        run: cargo nextest run --workspace --all-targets

  large:
    name: Test (large)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-latest
          save-if: false

      - name: Run the large tests
        run: cargo nextest run --profile large --workspace --all-targets
